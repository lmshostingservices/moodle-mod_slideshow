<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Back slide (depth layer) -->
  <rect x="22" y="12" width="58" height="40" rx="5" ry="5" fill="none" stroke="#fff" stroke-width="3" opacity="0.45"/>
  <!-- Main slide frame -->
  <rect x="12" y="20" width="58" height="40" rx="5" ry="5" fill="rgba(255,255,255,0.12)" stroke="#fff" stroke-width="4"/>
  <!-- Slide headline bar -->
  <rect x="21" y="29" width="22" height="4.5" rx="2.25" fill="#fff"/>
  <!-- Slide body lines -->
  <rect x="21" y="39" width="36" height="3" rx="1.5" fill="#fff" opacity="0.75"/>
  <rect x="21" y="47" width="26" height="3" rx="1.5" fill="#fff" opacity="0.5"/>
  <!-- Image placeholder (top-right of slide) -->
  <rect x="50" y="26" width="14" height="10" rx="2" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.65"/>
  <!-- Navigation dots row -->
  <circle cx="28" cy="73" r="2.8" fill="#fff" opacity="0.45"/>
  <circle cx="38" cy="73" r="3.2" fill="#fff"/>
  <circle cx="48" cy="73" r="2.8" fill="#fff" opacity="0.45"/>
  <!-- Forward arrow -->
  <line x1="62" y1="73" x2="77" y2="73" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <polyline points="72,67 79,73 72,79" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
